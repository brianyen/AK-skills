<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Arknights Skills</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="top-bar">
    <a href="/" id="go-home" class="go-home">Arknights Skills Quiz</a>
    <div id="help-button">Help Placeholder</div>
</div>
<div id="question-display"></div>
<div id="answer-display">
    <div class="options-toggle" id="answer-options-toggle">
        <div class="options-dropdown" id="answer-options-dropdown">
            <input type="text" placeholder="Select an operator..." autocomplete="off" class="options-filter" id="answer-options-filter"/>
        </div>
        <div class="options-select" id="answer-options-select">

        </div>
    </div>
</div>
<script th:src="@{/js/game.js}"></script>
</body>

</html>
